on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: sibling-parity

permissions:
  contents: read

jobs:
  sibling-parity:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            github::optimal2050/timescales

      - name: Install geoscales
        run: R CMD INSTALL .

      - name: Check sibling API parity
        run: Rscript tools/integration/test-sibling-parity.R
