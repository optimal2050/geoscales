# pkgdown builds ONLY the R reference, into `docs/r/`. The `docs/` root is the
# multi-language landing page (and, in a later phase, a Quarto site with
# language-agnostic `concepts/` beside `r/`, `python/` and `cpp/`).
url: https://optimal2050.github.io/geoscales/r/
destination: docs/r

template:
  bootstrap: 5
  light-switch: true
  # Twin-site theming: the siblings share structure and typography and
  # differ by one hue -- timescales #31688E (viridis blue, time),
  # geoscales #1F9E89 (viridis teal-green, space).
  bslib:
    primary: "#1F9E89"
    link-color: "#1F9E89"

# Pinned rather than `auto`: with `auto`, the first released version silently
# switches pkgdown to devel mode and relocates the whole site into `r/dev/`.
development:
  mode: unreleased
  version_label: danger

# Convention: figures are built on a SOLID background -- transparent PNGs
# are illegible in the site's dark mode.
figures:
  bg: "white"

# Home sidebar without the "Developers" box (citation covers attribution);
# footer without "Developed by ..." (built_with only).
home:
  sidebar:
    structure: [links, license, community, citation, dev]

footer:
  structure:
    left: built_with
    right: blank
  components:
    blank: ""

navbar:
  bg: primary

# The intro (vignettes/geoscales.Rmd, package-named) surfaces as the
# top-level "Get started" navbar item; everything else sits DIRECTLY in
# the Articles dropdown (`navbar: ~` = no "More articles..." detour).
articles:
  - title: "Reference"
    navbar: ~
    contents:
      - concepts
      - data-structures
      - data-manipulation
      - from-naturalearth
      - articles/visualization

# Old article URLs kept alive: plotting rewritten as visualization
# (2026-08 parity pass).
redirects:
  - ["articles/plotting.html", "articles/visualization.html"]

reference:
  - title: The Geoscale class
    desc: >
      A nested spatial partition: a flat table of weighted leaf regions
      ("atoms") plus the ordered geoframes that group them.
    contents:
      - Geoscale
      - geoscale_example
      - geoscale_geoframes
      - geoscale_regions
      - geoscale_rank
      - geoscale_weights
      - summary.Geoscale
      - "[.Geoscale"

  - title: Construction
    desc: >
      Three layers, from most to least convenient: a provider, parent-child
      crosswalks, or a wide table you already have.
    contents:
      - geoscale_from_provider
      - geoscale_build
      - geoscale_from_leaftable

  - title: Conversion
    desc: >
      Aggregation and disaggregation are one operation. Values are projected
      down to atoms and aggregated up to the target, so direction follows the
      geoframe ranks and cross-cutting geoframes need no special handling.
    contents:
      - recast_geoscale
      - recast_to_geoatoms
      - recast
      - geoscale_map
      - register_geoscale_map
      - clear_geoscale_maps
      - join_geoscale
      - GEOSCALE_RULES
      - register_geoscale_rule
      - get_geoscale_rule
      - list_geoscale_rules
      - clear_geoscale_rules

  - title: Navigation and subsetting
    desc: >
      Region codes are not unique across geoframes, so every lookup names
      its geoframe.
    contents:
      - geoscale_navigate
      - geoscale_leaftable
      - geoscale_family
      - geoscale_ancestry
      - geoscale_nests
      - filter_geoscale
      - geoscale_coverage
      - prune_geoscale
      - zoom_geoscale
      - geoscale_share

  - title: Geometry
    desc: >
      Optional, and backed by 'sf'. The core is geometry-free.
    contents:
      - attach_geometry_geoscale
      - geoscale_geometry
      - coords_to_region
      - add_area_geoscale

  - title: Visualization
    desc: >
      Composable choropleth layers, the structure icicle, and their
      plain-data workers. `geoscale_autoplot()` needs no map.
    contents:
      - geom_geoscale
      - geoscale_autoplot
      - plot.Geoscale
      - geoscale_plot
      - geoscale_layout

  - title: Data providers
    desc: >
      geoscales ships integration code, not data. Natural Earth is the default
      provider; its source and scale are recorded on the object, and no
      boundaries are bundled.
    contents:
      - get_geoscale_provider
      - register_geoscale_provider
      - list_geoscale_providers
      - ne_source
      - ne_geoscale

  - title: Geoframes
    contents:
      - CORE_GEOFRAMES
      - is_valid_geoframe

  - title: Package
    contents:
      - geoscales-package
